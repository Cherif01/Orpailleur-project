<div class="main-container">
  <div class="pd-ltr-20 xs-pd-20-10">
    <div class="min-height-200px">
      <div class="page-header">
        <div class="row">
          <div class="col-12 col-md-4 col-sm-12">
            <div class="title">
              <h4 class="text-capitalize fs-3">{{title}}</h4>
            </div>
            <nav aria-label="breadcrumb" role="navigation">
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item active"
                  aria-current="page">{{title}}</li>
              </ol>
            </nav>
          </div>
          <!-- <div class="text-right">
            <button mat-flat-button routerLink="/" color="primary">
              <span class="micon dw dw-mouse text-light"></span><span class="mtext mx-2">Autres</span>
            </button>
          </div> -->
        </div>
      </div>
      <!-- Export Datatable start -->
      <div class="..-box">
        <mat-card class="mat-elevation-z8">
          <mat-card-title>
            <h2 class="text-dark fw-bold text-center">
              <span class="mb-2">Achat du jour</span> <br>
              <span class="fw-bold text-primary">
                {{poidsAuj | number: '2.2-2' }} g
              </span>
            </h2>
            <hr>
          </mat-card-title>
          <mat-card-content>
            <div class="row justify-content-center">
              <div class="col-12 col-lg-3 col-md-6 mb-4">
                <div class="card elegant-card">
                  <div class="card-body text-center">
                    <div class="icon-wrapper bg-info">
                      <i class="dw dw-box"></i>
                    </div>
                    <h4 class="my-3 text-uppercase">POIDDS ENREGISTREÉ</h4>
                    <h5 class="text-muted">Aujourd'hui</h5>
                    <h2 class="text-dark">{{ 0 }} g</h2>
                  </div>
                </div>
              </div>
              <div class="col-12 col-lg-3 col-md-6 mb-4">
                <div class="card elegant-card">
                  <div class="card-body text-center">
                    <div class="icon-wrapper bg-warning">
                      <i class="dw dw-truck"></i>
                    </div>
                    <h4 class="my-3 text-uppercase">STOCK (EXPÉDIÉ)</h4>
                    <h5 class="text-muted">Aujourd'hui</h5>
                    <h2 class="text-dark">{{ 0 | number: '2.2-2' }} g</h2>
                  </div>
                </div>
              </div>
              <div class="col-12 col-lg-3 col-md-6 mb-4">
                <div class="card elegant-card">
                  <div class="card-body text-center">
                    <div class="icon-wrapper bg-success">
                      <i class="dw dw-inbox"></i>
                    </div>
                    <h4 class="my-3 text-uppercase">STOCK (ACTIF)</h4>
                    <h5 class="text-muted">Total</h5>
                    <h2 class="text-success">{{ 0 | number: '2.2-2' }} g</h2>
                  </div>
                </div>
              </div>
            </div>

          </mat-card-content>
        </mat-card>
      </div>
      <!-- Export Datatable End -->
    </div>
  </div>
</div>
