<div class="container-fluid">
  <div mat-dialog-content class>
    <div id="tableToExport">
      <table id class="table table-striped table-bordered" id="maTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Client</th>
            <th>Lot</th>
            <th>Type</th>
            <th>Poids</th>
            <th>CarratMoyen</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of dataExpedition">
            <td>{{data.created_at}}</td>
            <td>{{data.client}}</td>
            <td>{{data.arrivage}}</td>
            <td>{{data.type}}</td>
            <td>{{data.poids}}</td>
            <td>{{data.carrat}}</td>
          </tr>
          <!-- Ajoutez plus de lignes si nécessaire -->
        </tbody>
      </table>
    </div>
  </div>
  <div mat-dialog-actions>
    <button mat-raised-button color="primary" (click)="exportToPDF()">T&#233;l&#233;charger en PDF</button>
    <button mat-button mat-dialog-close color="warn">Fermer</button>
  </div>
  <div class="py-5"></div>
</div>
